<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職場霸凌申訴調查台</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#9F1239;--primary-dark:#881337;--primary-light:#FFE4E6;--primary-mid:#BE123C;--text:#2C2C2A;--text-muted:#5F5E5A;--text-hint:#888780;--border:#D3D1C7;--danger:#A32D2D;--danger-light:#FCEBEB;--success:#3B6D11;--success-light:#EAF3DE;--warning:#854F0B;--warning-light:#FAEEDA;--bg:#F1EFE8;--card:#FFFFFF;--radius:12px;--radius-sm:8px}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:2px solid var(--primary)}
.header h1{font-size:20px;font-weight:500;color:var(--primary-dark)}
.sync-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);background:var(--primary-light);padding:6px 12px;border-radius:20px;border:1px solid #F1C0C6}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.sync-dot.syncing{background:var(--primary-mid);animation:pulse 1s infinite}
.sync-dot.offline{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.privacy-banner{background:var(--warning-light);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 14px;margin:12px 0;font-size:12px;color:var(--warning);line-height:1.5}
.alert-section{background:var(--danger-light);border:1px solid var(--danger);border-radius:var(--radius);padding:12px 16px;margin:16px 0}
.alert-section h2{font-size:15px;font-weight:500;color:var(--danger);margin-bottom:8px}
.alert-item{background:#fff;border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.alert-item:last-child{margin-bottom:0}
.alert-item .ai-content{flex:1;min-width:0}
.alert-item .ai-title{font-weight:500;font-size:14px}
.alert-item .ai-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.alert-empty{font-size:13px;color:var(--text-muted);padding:8px 0}
.btn-action-sm{background:var(--primary);color:#fff;border:none;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;min-height:36px;flex-shrink:0}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0}
.tabs{display:flex;gap:4px;background:#fff;border-radius:var(--radius-sm);padding:4px;border:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 14px;font-size:13px;border:none;background:transparent;cursor:pointer;border-radius:6px;color:var(--text-muted);min-height:36px}
.tab.active{background:var(--primary);color:#fff;font-weight:500}
.search-box{flex:1;min-width:180px}
.search-box input{width:100%;padding:8px 12px;font-size:16px;border:1px solid var(--border);border-radius:var(--radius-sm);outline:none}
.btn-new{background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;min-height:40px}
.form-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;display:none}
.form-panel.show{display:block}
.form-panel h2{font-size:16px;font-weight:500;color:var(--primary-dark);margin-bottom:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field.full{grid-column:1/-1}
.form-field label{font-size:13px;color:var(--text-muted)}
.form-field input,.form-field select,.form-field textarea{padding:8px 10px;font-size:16px;border:1px solid var(--border);border-radius:6px;outline:none;font-family:inherit}
.form-field textarea{min-height:56px;resize:vertical}
.form-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.btn-submit{background:var(--primary);color:#fff;border:none;padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;min-height:44px}
.btn-cancel{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;min-height:44px}
.list{display:flex;flex-direction:column;gap:12px}
.case-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;border-left:4px solid var(--primary)}
.case-card.overdue{border-left-color:var(--danger)}
.case-card.closed{border-left-color:var(--success);opacity:.75}
.case-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.case-no{font-size:16px;font-weight:500}
.case-stage{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500;background:var(--primary-light);color:var(--primary)}
.case-parties{font-size:13px;color:var(--text-muted);margin-bottom:6px}
.case-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-muted);margin-top:8px}
.case-meta .od{color:var(--danger);font-weight:500}
.case-detail{font-size:13px;margin-top:8px}
.case-detail .cd-label{color:var(--text-muted);font-size:12px;margin-top:6px}
.case-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn-action{font-size:12px;border:1px solid var(--border);background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--text-muted);min-height:36px}
.btn-action:hover{border-color:var(--primary);color:var(--primary)}
.btn-action.danger:hover{border-color:var(--danger);color:var(--danger)}
.list-empty{text-align:center;padding:40px;color:var(--text-hint);font-size:14px}
.footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.btn-footer{font-size:12px;border:1px solid var(--border);background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--text-muted);min-height:36px}
.modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:var(--radius);padding:24px;max-width:400px;width:100%}
.modal h3{font-size:16px;margin-bottom:12px;color:var(--danger)}
.modal p{font-size:14px;margin-bottom:16px;color:var(--text-muted)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;text-align:center}
.toast.show{opacity:1}
@media(max-width:640px){.form-grid{grid-template-columns:1fr}.header h1{font-size:18px}.case-no{font-size:15px}}
</style>
</head>
<body>
<style>.nav{max-width:1000px;margin:0 auto;padding:10px 16px 0;display:flex;gap:8px;flex-wrap:wrap}.nav a{padding:8px 14px;border-radius:20px;background:#e2e8f0;color:#475569;font-size:14px;font-weight:600;text-decoration:none;min-height:38px;display:flex;align-items:center}.nav a.on{background:#9F1239;color:#fff}@media(max-width:768px){.nav{padding:10px 11px 0}.nav a{padding:8px 12px;font-size:13px}}</style>
<div class="nav"><a href="index.html">法規知識庫</a><a href="cases.html">調解案件</a><a href="schedule.html">月度排程</a><a href="bullying.html" class="on">霸凌調查</a></div>
<div class="wrap">
  <div class="header">
    <h1>職場霸凌申訴調查台</h1>
    <div class="sync-status"><span class="sync-dot" id="dot"></span><span id="syncTxt">載入中</span></div>
  </div>

  <div class="privacy-banner">
    保密提醒：本台請僅輸入<b>代稱</b>（如申訴人甲、被申訴人主管A），<b>切勿輸入真實姓名、身分證號或可識別個資</b>。案號與真實身分對照表請自行離線保管。頁面為公開網址，任何人取得連結皆可看見內容。
  </div>

  <div class="alert-section">
    <h2>調查期限警示（逾期／7 日內到期）</h2>
    <div id="alertList"><div class="alert-empty">載入中…</div></div>
  </div>

  <div class="controls">
    <div class="tabs">
      <button class="tab active" data-s="all">全部</button>
      <button class="tab" data-s="受理">受理</button>
      <button class="tab" data-s="訪談中">訪談中</button>
      <button class="tab" data-s="事證蒐集">事證蒐集</button>
      <button class="tab" data-s="事實認定">事實認定</button>
      <button class="tab" data-s="已結案">已結案</button>
    </div>
    <div class="search-box"><input id="q" placeholder="搜尋案號／代稱／單位"></div>
    <button class="btn-new" id="btnNew">新增案件</button>
  </div>

  <div class="form-panel" id="panel">
    <h2 id="panelTitle">新增案件</h2>
    <input type="hidden" id="fId">
    <div class="form-grid">
      <div class="form-field"><label>案號</label><input id="fNo" placeholder="B2026-004"></div>
      <div class="form-field"><label>調查階段</label><select id="fStage"><option>受理</option><option>訪談中</option><option>事證蒐集</option><option>事實認定</option><option>已結案</option></select></div>
      <div class="form-field"><label>申訴人（代稱）</label><input id="fComp" placeholder="甲"></div>
      <div class="form-field"><label>被申訴人（代稱）</label><input id="fResp" placeholder="主管A"></div>
      <div class="form-field"><label>單位（代稱）</label><input id="fUnit" placeholder="門市部"></div>
      <div class="form-field"><label>調查人／委員</label><input id="fInv" placeholder="外聘調查委員"></div>
      <div class="form-field"><label>受理日</label><input type="date" id="fRecv"></div>
      <div class="form-field"><label>調查期限日</label><input type="date" id="fDead"></div>
      <div class="form-field full"><label>訪談排程</label><textarea id="fInterview" placeholder="預計訪談對象與日期"></textarea></div>
      <div class="form-field full"><label>證據清單</label><textarea id="fEvid" placeholder="對話紀錄、郵件、排班表…"></textarea></div>
      <div class="form-field full"><label>事實認定</label><textarea id="fFacts"></textarea></div>
      <div class="form-field full"><label>處理建議</label><textarea id="fSugg"></textarea></div>
      <div class="form-field"><label>調查結果</label><select id="fResult"><option>調查中</option><option>成立</option><option>部分成立</option><option>不成立</option></select></div>
      <div class="form-field"><label>結案日</label><input type="date" id="fClose"></div>
      <div class="form-field full"><label>備註</label><textarea id="fNote"></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-submit" id="btnSave">儲存</button>
    </div>
  </div>

  <div class="list" id="list"><div class="list-empty">載入中…</div></div>

  <div class="footer">
    <div>
      <button class="btn-footer" id="btnExport">導出 JSON 備份</button>
      <button class="btn-footer" id="btnImport">匯入恢復</button>
      <input type="file" id="fileIn" accept=".json" style="display:none">
    </div>
    <button class="btn-footer" id="btnClear">清空全部資料</button>
  </div>
</div>

<div class="modal-mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">確認</h3>
    <p id="mText"></p>
    <div class="modal-actions">
      <button class="btn-cancel" id="mNo">取消</button>
      <button class="btn-submit" id="mYes">確定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var URL='https://trlrsnnotthblryrefez.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRybHJzbm5vdHRoYmxyeXJlZmV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzYxNTUsImV4cCI6MjEwNjk1MjE1NX0.BC120KHg3NO9tSw0WIaVj6AQKztjowdXf6PjxL_Zuso';
var TBL='bullying_cases';
var LSK='wb_bullying_';
var STAGES=['受理','訪談中','事證蒐集','事實認定','已結案'];

var state={items:[],filter:'all',q:'',today:''};

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayDiff(a,b){var x=new Date(a),y=new Date(b);if(isNaN(x)||isNaN(y))return null;return Math.round((y-x)/86400000);}

function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},opts.headers||{});
  return fetch(URL+'/rest/v1/'+path,opts).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(r.status+' '+t.substring(0,120));});
    if(opts.method==='DELETE')return r.text();
    return r.json();
  });
}

function setSync(mode){
  var d=$('dot'),t=$('syncTxt');
  d.className='sync-dot'+(mode==='syncing'?' syncing':(mode==='offline'?' offline':''));
  t.textContent=mode==='syncing'?'同步中':(mode==='offline'?'離線模式':'已同步');
}

function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show');},2200);}

var confirmCb=null;
function askConfirm(title,text,cb){
  $('mTitle').textContent=title;$('mText').textContent=text;confirmCb=cb;$('mask').classList.add('show');
}

function loadData(){
  setSync('syncing');
  api(TBL+'?select=*&order=receive_date.desc,id.desc').then(function(rows){
    state.items=rows||[];
    try{localStorage.setItem(LSK+'cache',JSON.stringify(state.items));}catch(e){}
    setSync('ok');renderAll();
  }).catch(function(e){
    setSync('offline');
    try{var c=JSON.parse(localStorage.getItem(LSK+'cache')||'[]');state.items=c;}catch(x){state.items=[];}
    console.error(e);renderAll();
  });
}

function isClosed(it){return it.stage==='已結案';}
function overdueDays(it){if(isClosed(it)||!it.deadline)return null;var d=dayDiff(it.deadline,state.today);return d;}

function nextStage(s){var i=STAGES.indexOf(s);return (i>=0&&i<STAGES.length-1)?STAGES[i+1]:null;}

function renderAll(){renderAlert();renderList();}
function renderAlert(){
  var box=$('alertList');
  var list=state.items.filter(function(it){
    if(isClosed(it)||!it.deadline)return false;
    var d=dayDiff(it.deadline,state.today);
    return d!==null&&(d>0||(d<=0&&-d<=7));
  }).sort(function(a,b){return new Date(a.deadline)-new Date(b.deadline);});
  if(!list.length){box.innerHTML='<div class="alert-empty">沒有逾期或即將到期的案件 ✓</div>';return;}
  box.innerHTML=list.map(function(it){
    var d=dayDiff(it.deadline,state.today);
    var tag=d>0?('<b style="color:var(--danger)">逾期 '+d+' 天</b>'):('剩餘 '+(-d)+' 天到期');
    return '<div class="alert-item"><div class="ai-content"><div class="ai-title">'+esc(it.case_no)+'　'+esc(it.complainant_alias||'')+' v. '+esc(it.respondent_alias||'')+'</div>'+
      '<div class="ai-meta">'+tag+'　期限 '+esc(it.deadline)+'　階段：'+esc(it.stage)+'</div></div>'+
      '<button class="btn-action-sm" data-adv="'+it.id+'">推進階段</button></div>';
  }).join('');
}

function renderList(){
  var list=state.items;
  if(state.filter!=='all')list=list.filter(function(it){return it.stage===state.filter;});
  if(state.q){
    var q=state.q.toLowerCase();
    list=list.filter(function(it){return [it.case_no,it.complainant_alias,it.respondent_alias,it.unit_alias,it.note,it.investigator].join(' ').toLowerCase().indexOf(q)>=0;});
  }
  var box=$('list');
  if(!list.length){box.innerHTML='<div class="list-empty">沒有符合的案件</div>';return;}
  box.innerHTML=list.map(function(it){
    var cls=isClosed(it)?'closed':(overdueDays(it)>0?'overdue':'');
    var d=dayDiff(it.deadline,state.today);
    var meta='<span>受理：'+esc(it.receive_date||'—')+'</span>';
    if(it.deadline){
      meta+=isClosed(it)?('<span>期限：'+esc(it.deadline)+'</span>')
        :(d>0?('<span class="od">期限 '+esc(it.deadline)+'（逾期 '+d+' 天）</span>'):('<span>期限：'+esc(it.deadline)+'（剩 '+(-d)+' 天）</span>'));
    }
    if(it.investigator)meta+='<span>調查人：'+esc(it.investigator)+'</span>';
    if(it.close_date)meta+='<span>結案：'+esc(it.close_date)+'</span>';
    var det='';
    [['訪談排程',it.interview_plan],['證據清單',it.evidence],['事實認定',it.facts],['處理建議',it.suggestion],['備註',it.note]].forEach(function(p){
      if(p[1])det+='<div class="cd-label">'+p[0]+'</div><div>'+esc(p[1])+'</div>';
    });
    var ns=nextStage(it.stage);
    return '<div class="case-card '+cls+'">'+
      '<div class="case-head"><div class="case-no">'+esc(it.case_no)+'</div><div class="case-stage">'+esc(it.stage)+(it.result?'　'+esc(it.result):'')+'</div></div>'+
      '<div class="case-parties">申訴人：'+esc(it.complainant_alias||'—')+'　／　被申訴人：'+esc(it.respondent_alias||'—')+(it.unit_alias?'　（'+esc(it.unit_alias)+'）':'')+'</div>'+
      '<div class="case-meta">'+meta+'</div>'+
      (det?'<div class="case-detail">'+det+'</div>':'')+
      '<div class="case-actions">'+(ns?'<button class="btn-action" data-adv="'+it.id+'">推進至「'+ns+'」</button>':'')+
      '<button class="btn-action" data-edit="'+it.id+'">編輯</button>'+
      '<button class="btn-action danger" data-del="'+it.id+'">刪除</button></div></div>';
  }).join('');
}

function openForm(it){
  $('fId').value=it?it.id:'';
  $('panelTitle').textContent=it?'編輯案件':'新增案件';
  $('fNo').value=it?(it.case_no||''):'';
  $('fStage').value=it?(it.stage||'受理'):'受理';
  $('fComp').value=it?(it.complainant_alias||''):'';
  $('fResp').value=it?(it.respondent_alias||''):'';
  $('fUnit').value=it?(it.unit_alias||''):'';
  $('fInv').value=it?(it.investigator||''):'';
  $('fRecv').value=it?(it.receive_date||''):state.today;
  $('fDead').value=it?(it.deadline||''):'';
  $('fInterview').value=it?(it.interview_plan||''):'';
  $('fEvid').value=it?(it.evidence||''):'';
  $('fFacts').value=it?(it.facts||''):'';
  $('fSugg').value=it?(it.suggestion||''):'';
  $('fResult').value=it?(it.result||'調查中'):'調查中';
  $('fClose').value=it?(it.close_date||''):'';
  $('fNote').value=it?(it.note||''):'';
  $('panel').classList.add('show');
  $('panel').scrollIntoView({behavior:'smooth',block:'start'});
}

function saveForm(){
  var o={case_no:$('fNo').value.trim()||null,stage:$('fStage').value,
    complainant_alias:$('fComp').value.trim()||null,respondent_alias:$('fResp').value.trim()||null,
    unit_alias:$('fUnit').value.trim()||null,investigator:$('fInv').value.trim()||null,
    receive_date:$('fRecv').value||null,deadline:$('fDead').value||null,
    interview_plan:$('fInterview').value.trim()||null,evidence:$('fEvid').value.trim()||null,
    facts:$('fFacts').value.trim()||null,suggestion:$('fSugg').value.trim()||null,
    result:$('fResult').value,close_date:$('fClose').value||null,note:$('fNote').value.trim()||null};
  if(!o.case_no){alert('請填案號');return;}
  var id=$('fId').value;
  var call=id?api(TBL+'?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(o)})
              :api(TBL,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify([o])});
  call.then(function(rows){
    if(rows&&rows[0]){
      if(id){state.items=state.items.map(function(x){return x.id==id?rows[0]:x;});}
      else{state.items.unshift(rows[0]);}
    }else{loadData();}
    $('panel').classList.remove('show');renderAll();toast('已儲存');
  }).catch(function(e){alert('儲存失敗');console.error(e);});
}

function advance(id){
  var it=state.items.filter(function(x){return x.id==id;})[0];if(!it)return;
  var ns=nextStage(it.stage);if(!ns){toast('已是最後階段');return;}
  var o={stage:ns};
  if(ns==='已結案'){o.close_date=state.today;if(it.result==='調查中')o.result='成立';}
  api(TBL+'?id=eq.'+id,{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(o)})
    .then(function(rows){
      if(rows&&rows[0])state.items=state.items.map(function(x){return x.id==id?rows[0]:x;});
      renderAll();toast('已推進至「'+ns+'」');
    }).catch(function(e){alert('更新失敗');console.error(e);});
}

function delCase(id){
  var it=state.items.filter(function(x){return x.id==id;})[0];if(!it)return;
  askConfirm('刪除案件','確定刪除 '+it.case_no+'？此動作無法復原。',function(){
    api(TBL+'?id=eq.'+id,{method:'DELETE'}).then(function(){
      state.items=state.items.filter(function(x){return x.id!=id;});renderAll();toast('已刪除');
    }).catch(function(e){alert('刪除失敗');console.error(e);});
  });
}

function doExport(){
  var b=new Blob([JSON.stringify({exported_at:new Date().toISOString(),items:state.items},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='霸凌調查案件備份_'+state.today+'.json';a.click();
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    var d;
    try{d=JSON.parse(fr.result);}catch(e){alert('檔案格式錯誤');return;}
    var arr=d.items||d;
    if(!Array.isArray(arr)||!arr.length){alert('沒有可匯入的資料');return;}
    askConfirm('匯入資料','將匯入 '+arr.length+' 筆案件（會附加到現有資料），確定？',function(){
      var payload=arr.map(function(x){delete x.id;return x;});
      api(TBL,{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(payload)})
        .then(function(){loadData();toast('已匯入 '+arr.length+' 筆');})
        .catch(function(e){alert('匯入失敗');console.error(e);});
    });
  };
  fr.readAsText(file);
}
function doClear(){
  askConfirm('清空全部資料','將刪除所有案件資料（建議先導出備份），確定？',function(){
    api(TBL+'?id=gt.0',{method:'DELETE'}).then(function(){state.items=[];renderAll();toast('已清空');})
      .catch(function(e){alert('清空失敗');console.error(e);});
  });
}

function bind(){
  $('btnNew').addEventListener('click',function(){openForm(null);});
  $('btnCancel').addEventListener('click',function(){$('panel').classList.remove('show');});
  $('btnSave').addEventListener('click',saveForm);
  $('q').addEventListener('input',function(){state.q=this.value.trim();renderList();});
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('active');});
      t.classList.add('active');state.filter=t.getAttribute('data-s');renderList();
    });
  });
  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-adv],[data-edit],[data-del]');if(!el)return;
    if(el.hasAttribute('data-adv'))advance(+el.getAttribute('data-adv'));
    else if(el.hasAttribute('data-edit')){
      var id=+el.getAttribute('data-edit');
      openForm(state.items.filter(function(x){return x.id==id;})[0]);
    }
    else if(el.hasAttribute('data-del'))delCase(+el.getAttribute('data-del'));
  });
  $('btnExport').addEventListener('click',doExport);
  $('btnImport').addEventListener('click',function(){$('fileIn').click();});
  $('fileIn').addEventListener('change',function(){if(this.files[0])doImport(this.files[0]);this.value='';});
  $('btnClear').addEventListener('click',doClear);
  $('mNo').addEventListener('click',function(){$('mask').classList.remove('show');confirmCb=null;});
  $('mYes').addEventListener('click',function(){$('mask').classList.remove('show');if(confirmCb)confirmCb();confirmCb=null;});
  $('mask').addEventListener('click',function(e){if(e.target===this){this.classList.remove('show');confirmCb=null;}});
}

document.addEventListener('DOMContentLoaded',function(){
  state.today=iso(new Date());
  bind();
  loadData();
});
</script>
</body>
</html>
